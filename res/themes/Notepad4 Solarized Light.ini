[Global Styles]
Default Code Style=font:$(Code); fore:#2F3E46; back:#FDF6E3
Default Text Style=font:$(Text); fore:#2F3E46; back:#FDF6E3
Margin and Line Number=size:-2; fore:#586E75; back:#EEE8D5
Current Line=back:#E8DFC4; alpha:40
Caret=fore:#2F3E46; back:#2F3E46
Matching Brace=fore:#9A6E00; alpha:70

[TXT Syntax]
Default=fore:#2F3E46; back:#FDF6E3
Header 1=bold; fore:#9A6E00
Comment=fore:#6F8A00
Link=fore:#1F8A84
Variable=fore:#1F6F97
Number=fore:#B03060
Operator=fore:#A5461A
String=fore:#B03026
Regex=fore:#5C63B8
Symbol=fore:#586E75
