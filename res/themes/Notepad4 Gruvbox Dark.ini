[Global Styles]
Default Code Style=font:$(Code); fore:#EBDBB2; back:#282828
Default Text Style=font:$(Text); fore:#EBDBB2; back:#282828
Margin and Line Number=size:-2; fore:#928374; back:#32302F
Current Line=back:#3C3836; alpha:45
Caret=fore:#EBDBB2; back:#EBDBB2
Matching Brace=fore:#FABD2F; alpha:70

[TXT Syntax]
Default=fore:#EBDBB2; back:#282828
Header 1=bold; fore:#FABD2F
Comment=fore:#B8BB26
Link=fore:#83A598
Variable=fore:#8EC07C
Number=fore:#D3869B
Operator=fore:#FE8019
String=fore:#FB4934
Regex=fore:#B16286
Symbol=fore:#A89984
