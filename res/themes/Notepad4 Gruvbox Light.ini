[Global Styles]
Default Code Style=font:$(Code); fore:#3C3836; back:#FBF1C7
Default Text Style=font:$(Text); fore:#3C3836; back:#FBF1C7
Margin and Line Number=size:-2; fore:#928374; back:#EBDBB2
Current Line=back:#EBDBB2; alpha:45
Caret=fore:#3C3836; back:#3C3836
Matching Brace=fore:#B57614; alpha:70

[TXT Syntax]
Default=fore:#3C3836; back:#FBF1C7
Header 1=bold; fore:#B57614
Comment=fore:#79740E
Link=fore:#427B58
Variable=fore:#076678
Number=fore:#8F3F71
Operator=fore:#AF3A03
String=fore:#9D0006
Regex=fore:#8F3F71
Symbol=fore:#7C6F64
