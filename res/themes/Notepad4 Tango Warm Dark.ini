[Global Styles]
Default Code Style=font:$(Code); fore:#E2D8C3; back:#24211E
Default Text Style=font:$(Text); fore:#E2D8C3; back:#24211E
Margin and Line Number=size:-2; fore:#948A7F; back:#2D2926
Current Line=back:#36302A; alpha:45
Caret=fore:#E2D8C3; back:#E2D8C3
Matching Brace=fore:#D6A86C; alpha:70

[TXT Syntax]
Default=fore:#E2D8C3; back:#24211E
Header 1=bold; fore:#D6A86C
Comment=fore:#9DAF70
Link=fore:#93BFB1
Variable=fore:#CDBD8B
Number=fore:#C9A77A
Operator=fore:#D9B884
String=fore:#CC9387
Regex=fore:#BA91AB
Symbol=fore:#9E9082
